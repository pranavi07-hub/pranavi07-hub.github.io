<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MarketPulse logo">
  <title>MarketPulse logo</title>
  <desc>A black line that starts flat, spikes into a heartbeat blip, then rises as a jagged upward streak, ending in a bold pulsing dot with concentric rings at the peak.</desc>

  <polyline points="40,170 75,170 90,130 105,190 120,170 150,170 170,110 185,150 200,80"
    fill="none" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="200" cy="80" r="7" fill="#0A0A0A"/>
  <circle cx="200" cy="80" r="16" fill="none" stroke="#0A0A0A" stroke-width="3" opacity="0.55"/>
  <circle cx="200" cy="80" r="25" fill="none" stroke="#0A0A0A" stroke-width="3" opacity="0.3"/>
</svg>
